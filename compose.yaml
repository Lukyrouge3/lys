services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: lys
      POSTGRES_PASSWORD: lys
      POSTGRES_DB: lys
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lys"]
      interval: 5s
      timeout: 3s
      retries: 12

  cliproxy:
    image: eceasy/cli-proxy-api:latest
    restart: unless-stopped
    ports:
      - "8317:8317" # API
      # OAuth callback ports (only needed during login)
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ./cliproxy/config.yaml:/CLIProxyAPI/config.yaml
      - ./cliproxy/auths:/root/.cli-proxy-api
      - ./cliproxy/logs:/CLIProxyAPI/logs

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "9999:9999"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: "openrouter"
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY}
    volumes:
      - hindsight-data:/home/hindsight/.pg0

  bot:
    build: ./back
    # back/.env names the stack services directly (postgres, hindsight,
    # cliproxy). Dev machines running the bot outside docker map those
    # names in /etc/hosts instead.
    env_file: ./back/.env
    # The public DNS records of mail.deneria.net and nextcloud.deneria.net
    # don't answer from inside the container (the bot timed out reaching
    # Nextcloud); the LAN addresses do. Same as the hosts entries on dev
    # machines.
    extra_hosts:
      - "mail.deneria.net:10.10.10.12"
      - "nextcloud.deneria.net:10.10.10.10"
    # The jobs API (browser extension -> bot) binds every interface INSIDE the
    # container (JOBS_HOST); the publish rule above keeps the port on the host's
    # loopback only, so reach it through an SSH tunnel:
    #   ssh -L 8787:127.0.0.1:8787 user@host
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      JOBS_HOST: "0.0.0.0"
      # Document prep runs on its own agent (see the Agent table) so a stronger model can write the CV and letter while mail stays on the cheap one.
      PREP_AGENT: "prep"
      # The job ranker also uses the stronger agent: one call per click, and judging fit needs it.
      JOB_RANKER_AGENT: "prep"
      # A runaway guard, not a budget: spreading prep over days costs the same, so this only stops a loop or a click-spree. Set 0 for no cap.
      PREP_DAILY_CAP: "50"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  hindsight-data:
