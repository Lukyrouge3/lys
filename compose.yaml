services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: lys
      POSTGRES_PASSWORD: lys
      POSTGRES_DB: lys
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  cliproxy:
    image: eceasy/cli-proxy-api:latest
    restart: unless-stopped
    ports:
      - "8317:8317" # API
      # OAuth callback ports (only needed during login)
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ./cliproxy/config.yaml:/CLIProxyAPI/config.yaml
      - ./cliproxy/auths:/root/.cli-proxy-api
      - ./cliproxy/logs:/CLIProxyAPI/logs

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "9999:9999"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: "openrouter"
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY}
    volumes:
      - hindsight-data:/home/hindsight/.pg0

  bot:
    build: ./back
    # The bot reads the same environment as `deno task dev` in back/.
    env_file: ./back/.env
    # Runs on the host network so the localhost URLs stored in back/.env
    # and in the provider table (postgres, cliproxy, hindsight) work as-is.
    network_mode: host
    restart: unless-stopped

volumes:
  postgres-data:
  hindsight-data:
